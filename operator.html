<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Operator - Antri Sehat Waras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="halaman-operator">
  <!-- Navbar panel operator (pola sama dengan navbar dashboard admin) -->
  <header class="navbar operator-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">✚</span>
      <span class="brand-name">Antri Sehat Waras</span>
    </div>

    <nav aria-label="Navigasi utama">
      <!-- Diisi auth.js sesuai role yang login (admin: 4 halaman,
           moderator: 4 halaman, user: ambil antrean + layar) -->
    </nav>

    <div class="user-menu">
      <p id="infoPengguna">Memuat pengguna...</p>
      <button type="button" id="tombolLogout">Logout</button>
    </div>
  </header>

  <main class="operator-main">
    <!-- Pilih poli yang sedang ditangani -->
    <section class="operator-poli" aria-label="Poli yang sedang ditangani">
      <label for="pilihanPoli">Poli yang ditangani</label>
      <select id="pilihanPoli"></select>
    </section>

    <section class="operator-grid" aria-label="Status panggilan antrean">
      <article class="kartu-antrian kartu-aktif">
        <h2>Sedang Dipanggil</h2>
        <p id="tiketAktif" class="nomor-tiket" aria-live="polite">—</p>
        <p id="detailAktif">Belum ada tiket yang dipanggil.</p>
        <div class="aksi-operator">
          <button type="button" id="tombolPanggil" class="tombol-primer">Panggil Berikutnya</button>
          <button type="button" id="tombolLewati">Lewati</button>
          <button type="button" id="tombolSelesai">Selesai</button>
        </div>
      </article>

      <article class="kartu-antrian kartu-berikutnya">
        <h2>Berikutnya</h2>
        <p id="tiketBerikutnya" class="nomor-tiket" aria-live="polite">—</p>
        <p id="detailBerikutnya">Belum ada tiket menunggu.</p>
      </article>
    </section>

    <section class="kartu-antrian">
      <h2>Daftar Tunggu <span id="jumlahTunggu"></span></h2>
      <div class="tabel-antrian-wrap">
        <table class="tabel-antrian">
          <thead>
            <tr><th>Nomor</th><th>Layanan</th><th>Prioritas</th><th>Waktu</th></tr>
          </thead>
          <tbody id="daftarTunggu"></tbody>
        </table>
      </div>
      <p id="pesanKosong" class="pesan-kosong" hidden>Tidak ada tiket yang menunggu.</p>
    </section>
    <p id="pesanOperator" role="status" aria-live="polite"></p>
  </main>

  <script src="dist/auth.js" defer></script>
  <script src="dist/operator.js" defer></script>
</body>
</html>
