<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Monitor Antrean - Antri Sehat Waras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="halaman-layar">

  <!-- Header Layar -->
  <header class="navbar layar-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">✚</span>
      <div class="brand-title">
        <h1>Antri Sehat Waras</h1>
        <p>Layar Monitor Utama Antrean Pasien</p>
      </div>
    </div>

    <nav aria-label="Navigasi utama">
      <!-- Diisi auth.js sesuai role yang login (admin: 4 halaman,
           moderator: 4 halaman, user: ambil antrean + layar) -->
    </nav>

    <div class="layar-aksi">
      <span class="live-indicator" aria-label="Status koneksi real-time">
        <span class="live-dot" aria-hidden="true"></span>
        LIVE
      </span>

      <button
        type="button"
        id="tombolSuara"
        class="tombol-suara"
        aria-pressed="false"
        aria-label="Pengumuman suara panggilan antrean"
      >
        🔇 Suara Nonaktif
      </button>
      <p id="pesanSuara" class="pesan-suara" role="status">
        Suara nonaktif — aktifkan untuk pengumuman panggilan.
      </p>

      <button type="button" id="tombolFullscreen" class="tombol-fullscreen">
        ⛶ Layar Penuh
      </button>
    </div>

    <div class="user-menu">
      <p id="infoPengguna">Memuat pengguna...</p>
      <button type="button" id="tombolLogout">
        Logout
      </button>
    </div>
  </header>

  <!-- Konten Utama Layar Monitor -->
  <main class="layar-container">

    <!-- Ringkasan global: panggilan terbaru & antrean berikutnya -->
    <section class="seksi-ringkasan-layar" aria-label="Ringkasan global antrean">
      <article class="kartu-ringkasan-layar kartu-panggilan-terbaru">
        <p class="label-ringkasan-layar">PANGGILAN TERBARU</p>
        <p id="nomorTerbaru" class="nomor-ringkasan-layar kosong">Belum ada panggilan</p>
        <p id="layananTerbaru" class="layanan-ringkasan-layar" hidden>—</p>
        <div id="metaTerbaru" class="meta-ringkasan-layar" hidden>
          <span id="prioritasTerbaru" class="chip-ringkasan-layar">—</span>
          <span id="waktuTerbaru" class="chip-ringkasan-layar chip-waktu">—</span>
        </div>
      </article>

      <article class="kartu-ringkasan-layar kartu-antrean-berikutnya">
        <p class="label-ringkasan-layar">ANTREAN BERIKUTNYA</p>
        <p id="nomorBerikutnya" class="nomor-ringkasan-layar kosong">Belum ada antrean berikutnya</p>
        <p id="layananBerikutnya" class="layanan-ringkasan-layar" hidden>—</p>
        <div id="metaBerikutnya" class="meta-ringkasan-layar" hidden>
          <span id="prioritasBerikutnya" class="chip-ringkasan-layar">—</span>
          <span id="waktuBerikutnya" class="chip-ringkasan-layar chip-waktu">—</span>
        </div>
      </article>
    </section>

    <!-- Panel Layar Per Jenis Antrean -->
    <section class="seksi-panel-layar" aria-label="Status per jenis layanan">
      <h2 class="layar-grid-judul">Status Antrean Tiap Layanan</h2>
      <div id="panelLayanan" class="grid-layar-panel">
        <p class="pesan-layanan-kosong">Memuat daftar layanan...</p>
      </div>
    </section>

  </main>

  <script src="dist/auth.js" defer></script>
  <script src="dist/layar.js" defer></script>
</body>
</html>
